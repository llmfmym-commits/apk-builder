<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>APK Builder</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Tahoma,Arial,sans-serif;
    background:#080d1a;
    color:white;
}

header{
    padding:30px 20px;
    text-align:center;
    background:linear-gradient(
        135deg,
        #101a3a,
        #18265c
    );
}

.logo{
    font-size:32px;
    font-weight:900;
}

.subtitle{
    margin-top:8px;
    color:#b8c2df;
}

.container{
    max-width:850px;
    margin:auto;
    padding:20px;
}

.card{
    background:#111a32;
    border:1px solid #29375f;
    border-radius:20px;
    padding:20px;
    margin-bottom:18px;
}

h2{
    margin-top:0;
}

label{
    display:block;
    margin:15px 0 7px;
    color:#c0c9df;
}

input,
textarea{
    width:100%;
    padding:14px;
    border-radius:13px;
    border:1px solid #3a4772;
    background:#080d1a;
    color:white;
    font-size:16px;
    outline:none;
}

textarea{
    min-height:160px;
    resize:vertical;
}

button{
    width:100%;
    border:0;
    border-radius:14px;
    padding:15px;
    margin-top:12px;
    background:#526ff5;
    color:white;
    font-size:17px;
    font-weight:bold;
}

button:active{
    transform:scale(.98);
}

.secondary{
    background:#252f4e;
}

.file-box{
    border:2px dashed #3d4d80;
    border-radius:15px;
    padding:25px;
    text-align:center;
    margin-top:10px;
}

.preview{
    width:100%;
    max-height:220px;
    object-fit:contain;
    margin-top:15px;
    border-radius:15px;
    display:none;
}

.status{
    margin-top:15px;
    padding:15px;
    border-radius:13px;
    background:#080d1a;
    border:1px solid #29375f;
    line-height:1.9;
}

.output{
    display:none;
}

.download{
    background:#00b978;
}

.warning{
    color:#ffd166;
}

</style>

</head>


<body>


<header>

    <div class="logo">
        🚀 APK Builder
    </div>

    <div class="subtitle">
        تبدیل سایت و HTML به برنامه اندروید
    </div>

</header>


<main class="container">


<!-- اطلاعات برنامه -->

<div class="card">

    <h2>
        📱 اطلاعات برنامه
    </h2>

    <label>
        نام برنامه
    </label>

    <input
        id="appName"
        type="text"
        placeholder="مثلاً ماشین حساب من"
    >


    <label>
        لینک سایت
    </label>

    <input
        id="siteUrl"
        type="url"
        placeholder="https://example.com"
    >


    <label>
        یا کد HTML
    </label>

    <textarea
        id="htmlCode"
        placeholder="کد HTML خودت را اینجا قرار بده..."
    ></textarea>

</div>


<!-- لوگو -->

<div class="card">

    <h2>
        🖼️ لوگوی برنامه
    </h2>

    <div class="file-box">

        <input
            id="iconFile"
            type="file"
            accept="image/png,image/jpeg,image/webp"
        >

        <img
            id="iconPreview"
            class="preview"
        >

    </div>

</div>


<!-- صفحه ورود -->

<div class="card">

    <h2>
        🚀 صفحه ورود
    </h2>

    <label>
        متن صفحه ورود
    </label>

    <input
        id="splashText"
        type="text"
        placeholder="مثلاً خوش آمدید"
    >


    <label>
        تصویر صفحه ورود
    </label>

    <div class="file-box">

        <input
            id="splashFile"
            type="file"
            accept="image/png,image/jpeg,image/webp"
        >

        <img
            id="splashPreview"
            class="preview"
        >

    </div>

</div>


<!-- ساخت -->

<div class="card">

    <h2>
        🔨 ساخت APK
    </h2>

    <p>
        اطلاعات برنامه آماده ساخت است.
    </p>

    <button
        onclick="prepareBuild()"
    >
        🚀 آماده‌سازی APK
    </button>


    <div
        id="status"
        class="status"
    >
        هنوز ساخت APK شروع نشده است.
    </div>

</div>


<!-- خروجی -->

<div
    id="output"
    class="card output"
>

    <h2>
        ✅ APK آماده شد
    </h2>

    <button
        class="download"
        onclick="downloadAPK()"
    >
        📦 دریافت APK
    </button>


    <button
        class="download"
        onclick="downloadZIP()"
    >
        🗜️ دریافت ZIP
    </button>

</div>


</main>


<script>


let iconData = null;
let splashData = null;


/* =========================
   تبدیل فایل به Base64
========================= */

function readFile(file){

    return new Promise(
        (resolve,reject)=>{

            const reader =
                new FileReader();

            reader.onload =
                ()=>{
                    resolve(
                        reader.result
                    );
                };

            reader.onerror =
                reject;

            reader.readAsDataURL(file);

        }
    );

}


/* =========================
   لوگو
========================= */

document
.getElementById("iconFile")
.addEventListener(
    "change",
    async function(){

        const file =
            this.files[0];

        if(!file)
            return;

        iconData =
            await readFile(file);

        const preview =
            document.getElementById(
                "iconPreview"
            );

        preview.src =
            iconData;

        preview.style.display =
            "block";

    }
);


/* =========================
   تصویر ورود
========================= */

document
.getElementById("splashFile")
.addEventListener(
    "change",
    async function(){

        const file =
            this.files[0];

        if(!file)
            return;

        splashData =
            await readFile(file);

        const preview =
            document.getElementById(
                "splashPreview"
            );

        preview.src =
            splashData;

        preview.style.display =
            "block";

    }
);


/* =========================
   آماده‌سازی
========================= */

function prepareBuild(){

    const appName =
        document
        .getElementById("appName")
        .value
        .trim();

    const siteUrl =
        document
        .getElementById("siteUrl")
        .value
        .trim();

    const htmlCode =
        document
        .getElementById("htmlCode")
        .value
        .trim();

    const splashText =
        document
        .getElementById("splashText")
        .value
        .trim();


    if(!appName){

        alert(
            "نام برنامه را وارد کن."
        );

        return;

    }


    if(!siteUrl && !htmlCode){

        alert(
            "لینک سایت یا HTML را وارد کن."
        );

        return;

    }


    const data = {

        appName:
            appName,

        siteUrl:
            siteUrl,

        htmlCode:
            htmlCode,

        splashText:
            splashText,

        icon:
            iconData,

        splash:
            splashData

    };


    localStorage.setItem(
        "apkBuilderProject",
        JSON.stringify(data)
    );


    document
    .getElementById("status")
    .innerHTML =

        "✅ اطلاعات برنامه ذخیره شد.<br><br>" +

        "نام: " +
        appName +
        "<br>" +

        "لینک: " +
        (
            siteUrl ||
            "HTML سفارشی"
        ) +

        "<br><br>" +

        "<span class='warning'>" +
        "مرحله بعد: ارسال اطلاعات به GitHub Actions و ساخت APK." +
        "</span>";


    document
    .getElementById("output")
    .style.display =
        "block";

}


/* =========================
   دانلود APK
========================= */

function downloadAPK(){

    alert(
        "بعد از اتصال GitHub Actions، APK واقعی از این قسمت دریافت می‌شود."
    );

}


/* =========================
   دانلود ZIP
========================= */

function downloadZIP(){

    alert(
        "بعد از اتصال GitHub Actions، ZIP شامل APK از این قسمت دریافت می‌شود."
    );

}


</script>


</body>

</html>
