name: Build Custom APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"


      - name: Read Build Configuration
        run: |

          python3 <<'PY'

          import json
          from pathlib import Path

          config_file = Path("build-config.json")

          if not config_file.exists():
              raise SystemExit(
                  "build-config.json not found"
              )

          config = json.loads(
              config_file.read_text(
                  encoding="utf-8"
              )
          )

          app_name = config.get(
              "appName",
              "My App"
          )

          print(
              "Building:",
              app_name
          )

          PY


      - name: Create package.json
        run: |

          cat > package.json <<'JSON'

          {
            "name": "custom-apk-builder",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "build": "echo build"
            },
            "dependencies": {
              "@capacitor/core": "^7.4.0",
              "@capacitor/android": "^7.4.0",
              "@capacitor/cli": "^7.4.0"
            }
          }

          JSON


      - name: Install Capacitor
        run: npm install


      - name: Prepare Website
        run: |

          mkdir -p www

          python3 <<'PY'

          import json
          import base64
          from pathlib import Path

          config = json.loads(
              Path("build-config.json").read_text(
                  encoding="utf-8"
              )
          )

          app_name = config.get(
              "appName",
              "My App"
          )

          html = config.get(
              "htmlCode",
              ""
          )

          site_url = config.get(
              "siteUrl",
              ""
          )

          splash_text = config.get(
              "splashText",
              ""
          )


          # اگر HTML وجود نداشته باشد،
          # از لینک سایت استفاده می‌کنیم.

          if html.strip():

              final_html = html

          elif site_url.strip():

              final_html = f"""<!DOCTYPE html>
          <html>
          <head>
          <meta charset="UTF-8">
          <meta
              name="viewport"
              content="width=device-width,initial-scale=1"
          >
          <title>{app_name}</title>

          <style>
          html,body {{
              margin:0;
              padding:0;
              width:100%;
              height:100%;
              overflow:hidden;
          }}

          iframe {{
              width:100%;
              height:100%;
              border:0;
          }}
          </style>

          </head>

          <body>

          <iframe
              src="{site_url}"
          ></iframe>

          </body>
          </html>
          """

          else:

              final_html = f"""<!DOCTYPE html>
          <html lang="fa" dir="rtl">
          <body>
          <h1>{app_name}</h1>
          <p>هیچ HTML یا لینکی وارد نشده است.</p>
          </body>
          </html>
          """


          Path(
              "www/index.html"
          ).write_text(
              final_html,
              encoding="utf-8"
          )


          # تصویر لوگو

          icon_data = config.get(
              "icon",
              ""
          )

          if icon_data:

              try:

                  header, data = icon_data.split(
                      ",",
                      1
                  )

                  image_bytes = base64.b64decode(
                      data
                  )

                  Path(
                      "icon-source"
                  ).write_bytes(
                      image_bytes
                  )

              except Exception as e:

                  print(
                      "Icon error:",
                      e
                  )


          # تصویر Splash

          splash_data = config.get(
              "splash",
              ""
          )

          if splash_data:

              try:

                  header, data = splash_data.split(
                      ",",
                      1
                  )

                  image_bytes = base64.b64decode(
                      data
                  )

                  Path(
                      "splash-source"
                  ).write_bytes(
                      image_bytes
                  )

              except Exception as e:

                  print(
                      "Splash error:",
                      e
                  )


          PY


      - name: Create Capacitor Config
        run: |

          python3 <<'PY'

          import json
          from pathlib import Path

          config = json.loads(
              Path("build-config.json").read_text(
                  encoding="utf-8"
              )
          )

          app_name = config.get(
              "appName",
              "My App"
          )

          capacitor = {

              "appId":
                  "com.apkbuilder.generated",

              "appName":
                  app_name,

              "webDir":
                  "www",

              "bundledWebRuntime":
                  False

          }

          Path(
              "capacitor.config.json"
          ).write_text(

              json.dumps(
                  capacitor,
                  ensure_ascii=False,
                  indent=2
              ),

              encoding="utf-8"
          )

          PY


      - name: Add Android
        run: npx cap add android


      - name: Sync Capacitor
        run: npx cap sync android


      - name: Configure Android App Name
        run: |

          python3 <<'PY'

          import json
          import re
          from pathlib import Path

          config = json.loads(
              Path("build-config.json").read_text(
                  encoding="utf-8"
              )
          )

          app_name = config.get(
              "appName",
              "My App"
          )


          strings = Path(
              "android/app/src/main/res/values/strings.xml"
          )

          if strings.exists():

              text = strings.read_text(
                  encoding="utf-8"
              )

              text = re.sub(
                  r'<string name="app_name">.*?</string>',
                  '<string name="app_name">'
                  + app_name
                  + '</string>',
                  text
              )

              strings.write_text(
                  text,
                  encoding="utf-8"
              )

          PY


      - name: Configure Icon
        run: |

          if [ -f "icon-source" ]; then

            mkdir -p android/app/src/main/res/drawable

            cp \
              icon-source \
              android/app/src/main/res/drawable/app_icon.png

          fi


      - name: Configure Splash
        run: |

          if [ -f "splash-source" ]; then

            mkdir -p android/app/src/main/res/drawable

            cp \
              splash-source \
              android/app/src/main/res/drawable/splash_custom.png

          fi


      - name: Build APK
        working-directory: android
        run: |

          chmod +x gradlew

          ./gradlew assembleDebug


      - name: Prepare APK and ZIP
        run: |

          mkdir -p output

          cp \
            android/app/build/outputs/apk/debug/app-debug.apk \
            output/app.apk

          cd output

          zip \
            Custom-APK.zip \
            app.apk


      - name: Upload APK
        uses: actions/upload-artifact@v4

        with:

          name: Custom-APK

          path:
            output/app.apk


      - name: Upload ZIP
        uses: actions/upload-artifact@v4

        with:

          name: Custom-APK-ZIP

          path:
            output/Custom-APK.zip
