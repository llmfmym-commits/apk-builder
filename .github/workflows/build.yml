name: Build Custom APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check HTML
        run: |
          echo "Checking www/index.html..."

          if [ ! -f "www/index.html" ]; then
            echo "ERROR: www/index.html not found!"
            exit 1
          fi

          echo "HTML found successfully."

      - name: Create package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "custom-apk-builder",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^7.4.3"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.4.3"
            }
          }
          EOF

      - name: Install Capacitor
        run: |
          npm install
          npm install @capacitor/android@7.4.3

      - name: Create Capacitor Config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.custom.apk",
            "appName": "Custom APK",
            "webDir": "www"
          }
          EOF

      - name: Add Android
        run: |
          npx cap add android

      - name: Sync Capacitor
        run: |
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare Output
        run: |
          mkdir -p output

          cp \
            android/app/build/outputs/apk/debug/app-debug.apk \
            output/Custom-APK.apk

          cd output

          zip \
            Custom-APK.zip \
            Custom-APK.apk

          echo "========== OUTPUT =========="
          ls -lah

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Custom-APK
          path: output/Custom-APK.apk

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Custom-APK-ZIP
          path: output/Custom-APK.zip
