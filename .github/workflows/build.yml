name: Build APK Builder

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "App name"
        required: true
        default: "My App"

      site_url:
        description: "Website URL"
        required: true
        default: "https://example.com"

  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"


      - name: Configure app
        env:
          INPUT_APP_NAME: ${{ github.event.inputs.app_name }}
          INPUT_SITE_URL: ${{ github.event.inputs.site_url }}
        run: |

          python3 <<'PY'

          import os
          import json
          from pathlib import Path

          app_name = os.environ.get(
              "INPUT_APP_NAME"
          ) or "APK Builder"

          site_url = os.environ.get(
              "INPUT_SITE_URL"
          ) or "https://example.com"

          app_name = app_name.strip()
          site_url = site_url.strip()

          if not app_name:
              app_name = "APK Builder"

          if not site_url.startswith("http://") and not site_url.startswith("https://"):
              raise SystemExit(
                  "Invalid URL. URL must start with http:// or https://"
              )

          config = {
              "appId": "com.apkbuilder.generated",
              "appName": app_name,
              "webDir": "www",
              "bundledWebRuntime": False
          }

          Path("capacitor.config.json").write_text(
              json.dumps(
                  config,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          html = f"""<!DOCTYPE html>
          <html lang="fa">
          <head>
          <meta charset="UTF-8">
          <meta
              name="viewport"
              content="width=device-width,initial-scale=1.0"
          >
          <title>{app_name}</title>

          <style>
          html,body {{
              margin:0;
              padding:0;
              width:100%;
              height:100%;
              overflow:hidden;
              background:#ffffff;
          }}

          iframe {{
              width:100%;
              height:100%;
              border:0;
          }}
          </style>

          </head>

          <body>

          <iframe
              src="{site_url}"
              allow="fullscreen"
          ></iframe>

          </body>
          </html>
          """

          Path("www").mkdir(
              parents=True,
              exist_ok=True
          )

          Path("www/index.html").write_text(
              html,
              encoding="utf-8"
          )

          print("App name:", app_name)
          print("Website:", site_url)

          PY


      - name: Install dependencies
        run: npm install


      - name: Initialize Capacitor
        run: npx cap add android


      - name: Sync Capacitor
        run: npx cap sync android


      - name: Set Android app name
        env:
          INPUT_APP_NAME: ${{ github.event.inputs.app_name }}
        run: |

          python3 <<'PY'

          import os
          from pathlib import Path

          app_name = os.environ.get(
              "INPUT_APP_NAME"
          ) or "APK Builder"

          path = Path(
              "android/app/src/main/res/values/strings.xml"
          )

          if path.exists():

              text = path.read_text(
                  encoding="utf-8"
              )

              import re

              text = re.sub(
                  r'<string name="app_name">.*?</string>',
                  f'<string name="app_name">{app_name}</string>',
                  text
              )

              path.write_text(
                  text,
                  encoding="utf-8"
              )

          PY


      - name: Build APK
        working-directory: android
        run: |

          chmod +x gradlew

          ./gradlew assembleDebug


      - name: Prepare output
        run: |

          mkdir -p output

          cp \
            android/app/build/outputs/apk/debug/app-debug.apk \
            output/APK-Builder.apk

          cd output

          zip APK-Builder.zip APK-Builder.apk


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-Builder-APK
          path: output/APK-Builder.apk


      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: APK-Builder-ZIP
          path: output/APK-Builder.zip
