name: Build Custom APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Check Website
        run: |
          echo "Checking www/index.html..."

          if [ ! -f "www/index.html" ]; then
            echo "ERROR: www/index.html not found!"
            exit 1
          fi

          echo "www/index.html found successfully."


      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"


      - name: Create package.json
        run: |
          cat > package.json <<'JSON'
          {
            "name": "custom-apk-builder",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^7.4.0",
              "@capacitor/android": "^7.4.0",
              "@capacitor/cli": "^7.4.0"
            }
          }
          JSON


      - name: Install Capacitor
        run: |
          npm install


      - name: Create Capacitor Config
        run: |
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.apkbuilder.generated",
            "appName": "Custom APK",
            "webDir": "www"
          }
          JSON


      - name: Add Android
        run: |
          npx cap add android


      - name: Sync Android
        run: |
          npx cap sync android


      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug


      - name: Prepare APK
        run: |
          mkdir -p output

          cp \
            android/app/build/outputs/apk/debug/app-debug.apk \
            output/Custom-APK.apk


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Custom-APK
          path: output/Custom-APK.apk
