name: Build Custom APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"


      - name: Check Build Configuration
        run: |

          echo "Checking build-config.json..."

          if [ ! -f "build-config.json" ]; then
            echo "ERROR: build-config.json not found!"
            exit 1
          fi

          echo "build-config.json found."


      - name: Create package.json
        run: |

          cat > package.json <<'JSON'

          {
            "name": "custom-apk-builder",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^7.4.0",
              "@capacitor/android": "^7.4.0",
              "@capacitor/cli": "^7.4.0"
            }
          }

          JSON


      - name: Install Capacitor
        run: npm install


      - name: Prepare Website
        run: |

          mkdir -p www

          python3 <<'PY'

          import json
          import base64
          from pathlib import Path

          config = json.loads(
              Path("build-config.json").read_text(
                  encoding="utf-8"
              )
          )

          app_name = config.get(
              "appName",
              "My App"
          )

          html = config.get(
              "htmlCode",
              ""
          )

          site_url = config.get(
              "siteUrl",
              ""
          )


          if html.strip():

              final_html = html

          elif site_url.strip():

              final_html = f"""<!DOCTYPE html>
          <html>
          <head>

          <meta charset="UTF-8">

          <meta
              name="viewport"
              content="width=device-width,initial-scale=1"
          >

          <title>{app_name}</title>

          <style>

          html,
          body {{
              margin:0;
              padding:0;
              width:100%;
              height:100%;
              overflow:hidden;
          }}

          iframe {{
              width:100%;
              height:100%;
              border:0;
          }}

          </style>

          </head>

          <body>

          <iframe
              src="{site_url}"
          ></iframe>

          </body>

          </html>
          """

          else:

              final_html = f"""<!DOCTYPE html>
          <html lang="fa" dir="rtl">

          <head>

          <meta charset="UTF-8">

          <meta
              name="viewport"
              content="width=device-width,initial-scale=1"
          >

          <title>{app_name}</title>

          </head>

          <body>

          <h1>{app_name}</h1>

          <p>
          هیچ HTML یا لینکی وارد نشده است.
          </p>

          </body>

          </html>
          """


          Path(
              "www/index.html"
          ).write_text(
              final_html,
              encoding="utf-8"
          )


          icon_data = config.get(
              "icon",
              ""
          )

          if icon_data:

              try:

                  header, data = icon_data.split(
                      ",",
                      1
                  )

                  image_bytes = base64.b64decode(
                      data
                  )

                  Path(
                      "icon-source"
                  ).write_bytes(
                      image_bytes
                  )

              except Exception as e:

                  print(
                      "Icon error:",
                      e
                  )


          splash_data = config.get(
              "splash",
              ""
          )

          if splash_data:

              try:

                  header, data = splash_data.split(
                      ",",
                      1
                  )

                  image_bytes = base64.b64decode(
                      data
                  )

                  Path(
                      "splash-source"
                  ).write_bytes(
                      image_bytes
                  )

              except Exception as e:

                  print(
                      "Splash error:",
                      e
                  )

          PY


      - name: Create Capacitor Config
        run: |

          python3 <<'PY'

          import json
          from pathlib import Path

          config = json.loads(
              Path("build-config.json").read_text(
                  encoding="utf-8"
              )
          )

          app_name = config.get(
              "appName",
              "My App"
          )

          capacitor = {

              "appId":
                  "com.apkbuilder.generated",

              "appName":
                  app_name,

              "webDir":
                  "www",

              "bundledWebRuntime":
                  False

          }

          Path(
              "capacitor.config.json"
          ).write_text(

              json.dumps(
                  capacitor,
                  ensure_ascii=False,
                  indent=2
              ),

              encoding="utf-8"
          )

          PY


      - name: Add Android
        run: npx cap add android


      - name: Sync Android
        run: npx cap sync android


      - name: Configure App Name
        run: |

          python3 <<'PY'

          import json
          import re
          from pathlib import Path

          config = json.loads(
              Path("build-config.json").read_text(
                  encoding="utf-8"
              )
          )

          app_name = config.get(
              "appName",
              "My App"
          )

          strings = Path(
              "android/app/src/main/res/values/strings.xml"
          )

          if strings.exists():

              text = strings.read_text(
                  encoding="utf-8"
              )

              text = re.sub(
                  r'<string name="app_name">.*?</string>',
                  '<string name="app_name">'
                  + app_name
                  + '</string>',
                  text
              )

              strings.write_text(
                  text,
                  encoding="utf-8"
              )

          PY


      - name: Configure Icon
        run: |

          if [ -f "icon-source" ]; then

            mkdir -p android/app/src/main/res/drawable

            cp \
              icon-source \
              android/app/src/main/res/drawable/app_icon.png

          fi


      - name: Configure Splash
        run: |

          if [ -f "splash-source" ]; then

            mkdir -p android/app/src/main/res/drawable

            cp \
              splash-source \
              android/app/src/main/res/drawable/splash_custom.png

          fi


      - name: Build APK
        working-directory: android
        run: |

          chmod +x gradlew

          ./gradlew assembleDebug


      - name: Prepare APK
        run: |

          mkdir -p output

          cp \
            android/app/build/outputs/apk/debug/app-debug.apk \
            output/app.apk

          echo "APK prepared successfully."

          ls -lh output/app.apk


      - name: Prepare ZIP
        run: |

          cd output

          zip \
            Custom-APK.zip \
            app.apk

          ls -lh Custom-APK.zip


      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4

        with:

          name: Custom-APK

          path:
            output/app.apk


      - name: Upload ZIP Artifact
        uses: actions/upload-artifact@v4

        with:

          name: Custom-APK-ZIP

          path:
            output/Custom-APK.zip


      - name: Publish APK to GitHub Release
        env:

          GH_TOKEN:
            ${{ github.token }}

        run: |

          echo "Publishing APK..."

          if gh release view latest >/dev/null 2>&1; then

            echo "Existing release found."

            gh release upload \
              latest \
              output/app.apk \
              output/Custom-APK.zip \
              --clobber

          else

            echo "Creating new release."

            gh release create \
              latest \
              output/app.apk \
              output/Custom-APK.zip \
              --title "Latest APK" \
              --notes "آخرین نسخه ساخته شده APK" \
              --latest

          fi

          echo "Release published successfully."
