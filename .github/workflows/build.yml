name: Build APK Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Initialize Capacitor
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare output
        run: |
          mkdir -p output

          cp android/app/build/outputs/apk/debug/app-debug.apk \
             output/APK-Builder.apk

          cd output

          zip APK-Builder.zip APK-Builder.apk

          cd ..

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-Builder-APK
          path: output/APK-Builder.apk

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: APK-Builder-ZIP
          path: output/APK-Builder.zip
