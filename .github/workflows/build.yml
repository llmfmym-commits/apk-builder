name: Build Custom APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      # =========================
      # Checkout
      # =========================

      - name: Checkout
        uses: actions/checkout@v4


      # =========================
      # Java
      # =========================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"


      # =========================
      # Node
      # =========================

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"


      # =========================
      # Check HTML
      # =========================

      - name: Check HTML
        run: |

          echo "Checking www/index.html..."

          if [ ! -f "www/index.html" ]; then
            echo "ERROR: www/index.html not found!"
            exit 1
          fi

          echo "HTML found successfully."


      # =========================
      # Create package.json
      # =========================

      - name: Create package.json
        run: |

          cat > package.json <<'EOF'
          {
            "name": "custom-apk-builder",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^7.4.3"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.4.3"
            }
          }
          EOF


      # =========================
      # Install Capacitor
      # =========================

      - name: Install Capacitor
        run: |

          npm install

          npm install @capacitor/android@7.4.3


      # =========================
      # Capacitor Config
      # =========================

      - name: Create Capacitor Config
        run: |

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.custom.apk",
            "appName": "Custom APK",
            "webDir": "www"
          }
          EOF


      # =========================
      # Add Android
      # =========================

      - name: Add Android
        run: |

          npx cap add android


      # =========================
      # Sync
      # =========================

      - name: Sync Capacitor
        run: |

          npx cap sync android


      # =========================
      # Build APK
      # =========================

      - name: Build APK
        working-directory: android
        run: |

          chmod +x gradlew

          ./gradlew assembleDebug --stacktrace


      # =========================
      # Prepare Output
      # =========================

      - name: Prepare Output
        run: |

          mkdir -p output

          cp \
            android/app/build/outputs/apk/debug/app-debug.apk \
            output/Custom-APK.apk

          cd output

          zip \
            Custom-APK.zip \
            Custom-APK.apk

          echo "========== OUTPUT =========="

          ls -lah


      # =========================
      # Upload Artifact
      # =========================

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4

        with:
          name: Custom-APK
          path: output/Custom-APK.apk


      - name: Upload ZIP Artifact
        uses: actions/upload-artifact@v4

        with:
          name: Custom-APK-ZIP
          path: output/Custom-APK.zip


      # =========================
      # Create GitHub Release
      # =========================

      - name: Create Release
        uses: softprops/action-gh-release@v2

        with:

          tag_name: "build-${{ github.run_number }}"

          name: "Custom APK Build ${{ github.run_number }}"

          body: |
            APK ساخته شده توسط APK Builder.

            Build Number:
            ${{ github.run_number }}

          files: |
            output/Custom-APK.apk
            output/Custom-APK.zip

        env:

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
