name: Build Custom APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"


      - name: Check Build Configuration
        run: |

          echo "Checking build-config.json..."

          if [ ! -f "build-config.json" ]; then
            echo "ERROR: build-config.json not found!"
            exit 1
          fi

          echo "build-config.json found."


      - name: Check Website
        run: |

          echo "Checking index.html..."

          if [ ! -f "www/index.html" ]; then
            echo "ERROR: www/index.html not found!"
            exit 1
          fi

          echo "index.html found."


      - name: Create package.json
        run: |

          cat > package.json <<'EOF'
          {
            "name": "apk-builder",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^7.4.3"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.4.3",
              "@capacitor/android": "^7.4.3"
            }
          }
          EOF


      - name: Install Capacitor
        run: npm install


      - name: Read App Configuration
        run: |

          python3 <<'PY'

          import json
          from pathlib import Path

          config = json.loads(
              Path("build-config.json").read_text(
                  encoding="utf-8"
              )
          )

          print("App name:", config.get("appName", "My App"))
          print("Site URL:", config.get("siteUrl", ""))

          PY


      - name: Create Capacitor Config
        run: |

          python3 <<'PY'

          import json
          from pathlib import Path

          config = json.loads(
              Path("build-config.json").read_text(
                  encoding="utf-8"
              )
          )

          app_name = config.get(
              "appName",
              "My App"
          )

          capacitor = {
              "appId": "com.apkbuilder.generated",
              "appName": app_name,
              "webDir": "www"
          }

          Path(
              "capacitor.config.json"
          ).write_text(
              json.dumps(
                  capacitor,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print("Capacitor configuration created.")

          PY


      - name: Add Android
        run: npx cap add android


      - name: Sync Android
        run: npx cap sync android


      - name: Configure App Name
        run: |

          python3 <<'PY'

          import json
          import re
          from pathlib import Path

          config = json.loads(
              Path("build-config.json").read_text(
                  encoding="utf-8"
              )
          )

          app_name = config.get(
              "appName",
              "My App"
          )

          strings = Path(
              "android/app/src/main/res/values/strings.xml"
          )

          if strings.exists():

              text = strings.read_text(
                  encoding="utf-8"
              )

              text = re.sub(
                  r'<string name="app_name">.*?</string>',
                  '<string name="app_name">'
                  + app_name
                  + '</string>',
                  text
              )

              strings.write_text(
                  text,
                  encoding="utf-8"
              )

          print("App name configured:", app_name)

          PY


      - name: Build APK
        working-directory: android
        run: |

          chmod +x gradlew

          ./gradlew assembleDebug


      - name: Prepare APK and ZIP
        run: |

          mkdir -p output

          cp \
            android/app/build/outputs/apk/debug/app-debug.apk \
            output/app.apk

          cd output

          zip \
            Custom-APK.zip \
            app.apk


      - name: Upload APK
        uses: actions/upload-artifact@v4

        with:
          name: Custom-APK
          path: output/app.apk


      - name: Upload ZIP
        uses: actions/upload-artifact@v4

        with:
          name: Custom-APK-ZIP
          path: output/Custom-APK.zip
